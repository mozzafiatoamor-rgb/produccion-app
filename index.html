function fmAddToPedido(){if(!_addToPedidoTarget)return'';return'<div class="modal-title">➕ Agregar a Pedido</div><div style="background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px"><div style="font-weight:700;margin-bottom:4px">📋 '+_addToPedidoTarget.titulo+'</div><div style="color:var(--text2);font-size:11px">Pedido original: '+_addToPedidoTarget.fecha+'</div></div><div class="form-group"><label class="form-label">Producto</label><div id="fAtpPWrap"><div class="autocomplete-wrap"><input class="form-input" id="fAtpP" placeholder="🔍 Buscar producto..." oninput="acInput(\'fAtpP\',S.catalogo,function(p){return p.producto},\'prod\')" onfocus="acInput(\'fAtpP\',S.catalogo,function(p){return p.producto},\'prod\')" autocomplete="off"><div class="autocomplete-list" id="fAtpPList"></div></div></div></div><div id="fAtpPriceInfo"></div><div class="form-group"><label class="form-label">Cantidad</label><input class="form-input" id="fAtpQ" type="number" inputmode="decimal" placeholder="0" min="0.1" step="0.1"></div><button class="btn btn-secondary" onclick="addToCartAddPedido()">➕ Agregar a lista</button><div id="cartAddPedido">'+renderCartAddPedido()+'</div><div class="cart-divider"></div><button class="btn btn-primary" onclick="submitAddToPedido()" '+(_cartAddToPedido.length===0?'disabled':'')+' id="btnSaveAddPedido">✅ Agregar '+_cartAddToPedido.length+' productos</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="closeModal()">✖ Cerrar</button>'}
function addToCartAddPedido(){var prod=acGetVal('fAtpP');var qty=document.getElementById('fAtpQ').value;if(!prod||!qty){toast('Completa campos',1);return}var p=S.catalogo.find(function(x){return x.producto===prod});var precio=p?p.precioRef:0;var sub=precio*parseFloat(qty);_cartAddToPedido.push({prod:prod,cat:p?.categoria||'',qty:parseFloat(qty),unidad:p?.unidad||'',precioRef:precio,subtotal:sub});toast(prod+' agregado');acClearC('fAtpP');document.getElementById('fAtpQ').value='';var pi=document.getElementById('fAtpPriceInfo');if(pi)pi.innerHTML='';document.getElementById('cartAddPedido').innerHTML=renderCartAddPedido();var btn=document.getElementById('btnSaveAddPedido');if(btn){btn.disabled=false;btn.innerHTML='✅ Agregar '+_cartAddToPedido.length+' productos'}}
function removeCartAddPedido(i){_cartAddToPedido.splice(i,1);document.getElementById('cartAddPedido').innerHTML=renderCartAddPedido();var btn=document.getElementById('btnSaveAddPedido');if(btn){btn.disabled=_cartAddToPedido.length===0;btn.innerHTML='✅ Agregar '+_cartAddToPedido.length+' productos'}}
function renderCartAddPedido(){if(!_cartAddToPedido.length)return'';var total=_cartAddToPedido.reduce(function(s,c){return s+c.subtotal},0);return'<div class="cart-header"><span class="ch-title">📋 Productos a agregar</span><span class="ch-count">'+_cartAddToPedido.length+' items</span></div>'+_cartAddToPedido.map(function(c,i){return'<div class="cart-item"><div class="ci-info"><div class="ci-name">'+c.prod+'</div><div class="ci-meta">'+c.qty+' '+c.unidad+' x '+fmt$(c.precioRef)+'</div></div><span class="ci-price">'+fmt$(c.subtotal)+'</span><button class="ci-del" onclick="removeCartAddPedido('+i+')">✖</button></div>'}).join('')+'<div class="cart-total"><span class="ct-label">Total Estimado</span><span class="ct-amount">'+fmt$(total)+'</span></div>'}
async function submitAddToPedido(){showWorking();if(!_cartAddToPedido.length||!_addToPedidoTarget)return;var titulo=_addToPedidoTarget.titulo;var origFecha=_addToPedidoTarget.fecha;var n=now();var syncItems=[];var totalEst=_cartAddToPedido.reduce(function(s,c){return s+c.subtotal},0);_cartAddToPedido.forEach(function(c){var id=nextId('PD',S.pedidos);var horaTag=n.time+' [+'+n.date+']';S.pedidos.unshift({id:id,fecha:origFecha,hora:horaTag,titulo:titulo,producto:c.prod,cantidad:c.qty,unidad:c.unidad,precioRef:c.precioRef,subtotal:c.subtotal,creador:uName(),estado:'Pendiente',_row:9999});syncItems.push({sheet:'📋 Pedidos',values:[id,origFecha,horaTag,titulo,c.prod,c.qty,c.unidad,c.precioRef,c.subtotal,uName(),'Pendiente']})});syncItems.push({sheet:'📜 Bitácora',values:[n.date,n.time,uName(),'Productos agregados',titulo+' +'+_cartAddToPedido.length+' items ('+fmt$(totalEst)+')','pedido']});var count=_cartAddToPedido.length;_cartAddToPedido=[];_addToPedidoTarget=null;toast(count+' productos agregados');closeModal();hideWorking();render();SyncQueue.add(syncItems,function(ok){if(ok)setTimeout(function(){Sheets.loadAll()},500)})}
// Override acPick for fAtpP
var _origAcPickForAtp=acPick;
acPick=function(inputId,val){_origAcPickForAtp(inputId,val);if(inputId==='fAtpP'){var p=S.catalogo.find(function(x){return x.producto===val});var pi=document.getElementById('fAtpPriceInfo');if(pi&&p)pi.innerHTML='<div style="background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px">💰 Precio ref: <strong>'+fmt$(p.precioRef)+'</strong> / '+p.unidad+'</div>'}}

// === BULK PEDIDO ACTIONS ===
var _selectedPedidos={};
var _lastGrouped={};
function togglePedidoSelect(key,evt){if(evt)evt.stopPropagation();var mc=document.querySelector('.main-content');var sy=mc?mc.scrollTop:0;if(_selectedPedidos[key])delete _selectedPedidos[key];else _selectedPedidos[key]=true;render();if(mc)mc.scrollTop=sy}
function selectAllPedidos(keys){var mc=document.querySelector('.main-content');var sy=mc?mc.scrollTop:0;if(Object.keys(_selectedPedidos).length===keys.length){_selectedPedidos={}}else{keys.forEach(function(k){_selectedPedidos[k]=true})}render();if(mc)mc.scrollTop=sy}
function getSelectedCount(){return Object.keys(_selectedPedidos).length}
async function bulkPedidoAction(action){var grouped=_lastGrouped;var selKeys=Object.keys(_selectedPedidos);if(!selKeys.length){toast('Selecciona pedidos',1);return}var labels={'completar':'Completar','archivar':'Archivar','eliminar':'Eliminar'};var msg=labels[action]+' '+selKeys.length+' pedido(s)?';showConfirm('⚡ '+labels[action],msg,async function(){showWorking();for(var i=0;i<selKeys.length;i++){var k=selKeys[i];var g=grouped[k];if(!g)continue;if(action==='completar')await _bulkComplete(g.titulo,g.fecha);else if(action==='archivar')await _bulkArchive(g.titulo,g.fecha);else if(action==='eliminar')await _bulkDelete(g.titulo)}_selectedPedidos={};toast(selKeys.length+' pedidos procesados');hideWorking();render();setTimeout(function(){Sheets.loadAll()},500)})}
async function _bulkComplete(titulo,fecha){var items=S.pedidos.filter(function(p){return p.titulo===titulo&&p.fecha===fecha&&p.estado!=='Completado'});await Promise.allSettled(items.map(function(p){return Sheets.deleteRow('📋 Pedidos',p._row).then(function(){return Sheets.append('📋 Pedidos',[p.id,p.fecha,p.hora,p.titulo,p.producto,p.cantidad,p.unidad,p.precioRef,p.subtotal,p.creador,'Completado'])})}));items.forEach(function(p){p.estado='Completado'});logAction('Pedido completado (bulk)',titulo,'pedido')}
async function _bulkArchive(titulo,fecha){var items=S.pedidos.filter(function(p){return p.titulo===titulo&&p.fecha===fecha&&p.estado!=='Archivado'});await Promise.allSettled(items.map(function(p){return Sheets.deleteRow('📋 Pedidos',p._row).then(function(){return Sheets.append('📋 Pedidos',[p.id,p.fecha,p.hora,p.titulo,p.producto,p.cantidad,p.unidad,p.precioRef,p.subtotal,p.creador,'Archivado'])})}));items.forEach(function(p){p.estado='Archivado'});logAction('Pedido archivado (bulk)',titulo,'archive')}
async function _bulkDelete(titulo){var rows=[];S.pedidos.forEach(function(p){if(p.titulo===titulo)rows.push(p._row)});rows.sort(function(a,b){return b-a});await Promise.allSettled(rows.map(function(r){return Sheets.deleteRow('📋 Pedidos',r)}));S.pedidos=S.pedidos.filter(function(p){return p.titulo!==titulo});logAction('Pedido eliminado (bulk)',titulo,'delete')}

(async function(){if(S.sheetId&&S.apiKey&&SCRIPT_URL){const su=localStorage.getItem('currentUser_compras');if(su){try{S.currentUser=JSON.parse(su);S.screen='main';S.connected=true;render();_initNav();await Sheets.loadUsers();const ok=S.usuarios.find(function(u){return u.usuario===S.currentUser.usuario});if(!ok){toast('Cuenta deshabilitada',1);logout();return}await Sheets.loadAll()}catch(e){S.screen='login';render()}}else{S.screen='login';S.connected=true;await Sheets.loadUsers();render()}}else{render()}})();


function _rptSrchContent(compras,prodSorted,pq){
  function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
  var html='';
  if(!pq){
    if(!prodSorted.length){return'<div class="rpt-empty">Sin compras en este periodo</div>';}
    html+='<div style="font-size:11px;color:var(--text2);margin-bottom:10px;letter-spacing:.5px">⚡ CLICK PARA VER HISTORIAL</div>';
    window._rptPL=prodSorted.slice(0,20).map(function(e){return e[0]});
    prodSorted.slice(0,20).forEach(function(e,i){
      html+='<div class="rpt-bar-row" style="cursor:pointer;padding:9px 10px;border-radius:10px;margin-bottom:4px;background:var(--surface)" onclick="_selProd('+(i)+')">'+
        '<div class="rpt-rank '+(i<3?'top3':'')+'">'+String(i+1)+'</div>'+
        '<div class="rpt-bar-info"><div class="rpt-bar-name">'+e[0]+'</div>'+
        '<div class="rpt-bar-sub">'+e[1].cat+' · '+e[1].compras+' compras · prom '+fmt$(e[1].qty>0?e[1].total/e[1].qty:0)+'/'+e[1].unit+'</div>'+
        '<div class="rpt-bar-track"><div class="rpt-bar-fill" style="width:'+(prodSorted[0]&&prodSorted[0][1].total>0?Math.round(e[1].total/prodSorted[0][1].total*100):0)+'%;background:'+rptColor(i)+'"></div></div></div>'+
        '<div class="rpt-bar-vals"><div class="rpt-bar-amount" style="color:'+rptColor(i)+'">'+fmt$(e[1].total)+'</div></div>'+
      '</div>';
    });
    return html;
  }
  var q=norm(pq);
  var matches=compras.filter(function(c){return norm(c.producto).includes(q)});
  if(!matches.length){return'<div class="rpt-empty">\u{1F50D} Sin resultados para «'+pq+'»</div>';}
  var uniqueProds={};
  matches.forEach(function(c){var k=c.producto;if(!uniqueProds[k])uniqueProds[k]={total:0,cnt:0,cat:c.categoria,unit:c.unidad};uniqueProds[k].total+=c.precio;uniqueProds[k].cnt++;});
  var names=Object.keys(uniqueProds).sort(function(a,b){return uniqueProds[b].total-uniqueProds[a].total});
  if(names.length>1){
    html+='<div style="font-size:11px;color:var(--text2);margin-bottom:10px">'+names.length+' artículos · click para ver detalle</div>';
    window._rptPL=names;
    names.forEach(function(name,i){
      var d=uniqueProds[name];
      html+='<div class="rpt-bar-row" style="cursor:pointer;padding:9px 10px;border-radius:10px;margin-bottom:4px;background:var(--surface)" onclick="_selProd('+(i)+')">'+
        '<div class="rpt-rank '+(i<3?'top3':'')+'">'+String(i+1)+'</div>'+
        '<div class="rpt-bar-info"><div class="rpt-bar-name">'+name+'</div>'+
        '<div class="rpt-bar-sub">'+d.cat+' · '+d.cnt+' compras · prom '+fmt$(d.total/d.cnt)+'</div></div>'+
        '<div class="rpt-bar-vals"><div class="rpt-bar-amount">'+fmt$(d.total)+'</div></div>'+
      '</div>';
    });
    return html;
  }
  var nm=names[0];
  var pc=matches.filter(function(c){return c.producto===nm});
  pc.sort(function(a,b){var da=rptParseDate(a.fecha),db=rptParseDate(b.fecha);return(db?db.getTime():0)-(da?da.getTime():0)});
  var tot=pc.reduce(function(s,c){return s+c.precio},0);
  var prs=pc.map(function(c){return c.precio});
  var pMin=Math.min.apply(null,prs),pMax=Math.max.apply(null,prs),pAvg=tot/pc.length;
  var byProv={};pc.forEach(function(c){var p=c.proveedor||'Sin proveedor';if(!byProv[p])byProv[p]=0;byProv[p]+=c.precio});
  var provS=Object.entries(byProv).sort(function(a,b){return b[1]-a[1]});
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
  html+='<button onclick="S.rptProdSearch=S._rptLastQ||\'\';S._rptLastQ=\'\';_frS()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text2)">&larr; Volver</button>';
  html+='<div style="font-weight:700;font-size:14px;color:var(--text)">'+nm+'</div>';
  html+='</div>';
  html+='<div class="stats-grid">'+
    '<div class="stat-box red"><div class="stat-number">'+fmt$(tot)+'</div><div class="stat-label">Total Gastado</div></div>'+
    '<div class="stat-box orange"><div class="stat-number">'+pc.length+'</div><div class="stat-label">Compras</div></div>'+
    '<div class="stat-box blue"><div class="stat-number">'+fmt$(pAvg)+'</div><div class="stat-label">Precio Prom</div></div>'+
  '</div>';
  html+='<div class="stats-grid">'+
    '<div class="stat-box green"><div class="stat-number">'+fmt$(pMin)+'</div><div class="stat-label">Precio Min</div></div>'+
    '<div class="stat-box yellow"><div class="stat-number">'+fmt$(pMax)+'</div><div class="stat-label">Precio Max</div></div>'+
    '<div class="stat-box cyan"><div class="stat-number">'+fmt$(pMax-pMin)+'</div><div class="stat-label">Variación</div></div>'+
  '</div>';
  if(provS.length>0){
    html+='<div class="rpt-section-title" style="margin-top:14px">\u{1F3EA} Proveedores</div>';
    provS.forEach(function(e,i){
      var pct=tot>0?Math.round(e[1]/tot*100):0;
      html+='<div class="rpt-bar-row"><div class="rpt-bar-info"><div class="rpt-bar-name">'+e[0]+'</div><div class="rpt-bar-track"><div class="rpt-bar-fill" style="width:'+pct+'%;background:'+rptColor(i)+'"></div></div></div><div class="rpt-bar-vals"><div class="rpt-bar-amount" style="color:'+rptColor(i)+'">'+fmt$(e[1])+'</div><div class="rpt-bar-pct">'+pct+'%</div></div></div>';
    });
  }
  html+='<div class="rpt-section-title" style="margin-top:14px">\u{1F4C5} Historial ('+pc.length+' compras)</div>';
  pc.forEach(function(c){
    var up=c.cantidad>0?c.precio/c.cantidad:c.precio;
    html+='<div class="rpt-detail-item" style="flex-direction:column;align-items:flex-start;gap:3px;padding:8px 0">'+
      '<div style="display:flex;justify-content:space-between;width:100%">'+
        '<span style="font-weight:600">'+c.fecha+'</span>'+
        '<span style="font-family:\'Space Mono\',monospace;font-weight:700;color:var(--accent)">'+fmt$(c.precio)+'</span>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--text2)">'+c.cantidad+' '+c.unidad+' · '+fmt$(up)+'/'+c.unidad+' · '+(c.proveedor||'Sin prov')+' · '+(c.comprador||'Sin asignar')+'</div>'+
    '</div>';
  });
  return html;
}

function _selProd(i){var pl=window._rptPL||[];if(i>=0&&i<pl.length){S._rptLastQ=S.rptProdSearch;S.rptProdSearch=pl[i];}_frS();}
function _frS(){
  var el=document.getElementById('rptSrchRes');
  if(!el){render();return;}
  var si=document.getElementById('rptProdSrch');
  if(si&&si!==document.activeElement)si.value=S.rptProdSearch||'';
  var D=S._rptData;
  el.style.display=S.rptProdSearch?'':'none';
  el.innerHTML=S.rptProdSearch?_rptSrchContent(S.compras||[],D?D.prodSorted:[],S.rptProdSearch):'';
}
